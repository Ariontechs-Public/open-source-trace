learned:
  - "Only one of the pair with REAL semantic search: `nomic-embed-code` (768d int8) compiled into the binary (vendored/nomic/), 11-signal combined scoring. No API key, no Ollama, no Docker."
  - "Hybrid LSP = a lightweight C reimplementation of tsserver/pyright/gopls/Roslyn/JDT/rust-analyzer-style type resolution for 11 languages — type-level accuracy beyond raw tree-sitter AST."
  - "Ambition vs maturity gap: ~14 MCP tools incl. Cypher (get_graph_schema), dead-code, cross-service HTTP linking, cross-repo CROSS_* edges, ADR mgmt, IaC (Docker/K8s/Kustomize). But still v0.8.x with stub features (ingest_traces is a no-op) and crash/Windows-noop/\"unusable after upgrade\" issues."
  - "Team-shared graph artifact: commit .codebase-memory/graph.db.zst (zstd 8-13:1, merge=ours) so teammates skip the reindex — a distribution idea codegraph lacks."
  - "RAM-first pipeline (LZ4 + in-memory SQLite, memory released after) → Linux kernel 28M LOC / 75K files in 3 min, <1ms queries. Heavy trust signaling: arXiv 2603.27277, OpenSSF Scorecard, SLSA3, VirusTotal."
  - "Clone is 1.3G — internal/cbm (1.2G) is the vendored C engine + grammars. Star growth ~3.6k/month (14k in ~4 months), ~1/3 of codegraph; 35 releases but still pre-1.0."
