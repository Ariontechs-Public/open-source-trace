one_line: "Community-maintained media downloader (youtube-dl fork): ~1,800 self-describing site extractors dispatched by per-extractor URL regex, a 4.5k-line YoutubeDL orchestrator, a format-selection mini-language, and a hand-rolled JS interpreter to defeat YouTube's signature challenges."
