learned:
  - "Unlike a catalog skill, impeccable ships ONE highly-opinionated design language ('Neo Kinpaku': kinpaku-gold + verdigris-patina on lacquer-black, OKLCH tokens) — taste by conviction, not by menu."
  - "DESIGN.md frontmatter is a portable token export that mirrors site/styles/kinpaku-tokens.css verbatim; the CSS file is the single source of truth (dual-write discipline noted in-file)."
  - "It's not just prose — cli/engine/ has a real anti-pattern detector that runs in a headless browser (detect-antipatterns-browser.js, ~212KB) to audit rendered UI, plus a design-system.mjs generator."
  - "Ships to ~14 harnesses via per-harness dirs (.claude/ .codex/ .cursor/ .gemini/ .pi/ .kiro/ .opencode/ .trae/ .qoder/ …) — the broadest cross-harness fan-out seen so far."
  - "The skill SKILL.src.md is the source of the `impeccable` skill that appears live in this very Claude Code session."
